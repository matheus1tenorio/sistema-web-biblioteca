<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - BiblioTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema">
        <span class="icon-light">🌙</span>
        <span class="icon-dark">☀️</span>
    </button>

    <!-- Vídeo de fundo -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="videos/biblioteca1.mp4" type="video/mp4">
    </video>
    <div class="overlay"></div>

    <div class="login-container">
        <div class="login-box">
            <h1>BiblioTech</h1>
            <p>Faça login para continuar</p>

            <form id="login-form">
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <button type="submit">Entrar</button>
            </form>

            <div class="links">
                <a href="esqueci-senha.html">Esqueci minha senha</a>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script>
        // Verificar se já está logado
        if (isAuthenticated()) {
            window.location.href = 'livros.html';
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            const result = await fazerLogin(email, senha);

            if (result.success) {
                alert(`Login realizado como ${result.user.role.toUpperCase()}`);
                window.location.href = 'livros.html';
            } else {
                alert(`${result.error}`);
            }
        });
    </script>
</body>

<script>
  document.getElementById('theme-toggle').addEventListener('click', function () {
    const root = document.documentElement;
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    localStorage.setItem('bibliotech-theme', next);
  });
</script>

</html>
