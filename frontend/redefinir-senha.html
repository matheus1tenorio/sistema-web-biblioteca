<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir Senha - BiblioTech</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <div class="cadastro-container">
        <div class="cadastro-box">
            <h1>Nova Senha</h1>
            <p>Crie uma nova senha para sua conta</p>
            
            <form id="reset-form">
                <input type="password" id="nova-senha" placeholder="Nova senha" required>
                <input type="password" id="confirmar-senha" placeholder="Confirmar nova senha" required>
                <button type="submit">Redefinir Senha</button>
            </form>

            <div class="links">
                <p><a href="login.html" class="login-link">Voltar ao Login</a></p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('reset-form').addEventListener('submit', (e) => {
            e.preventDefault();

            const novaSenha = document.getElementById('nova-senha').value;
            const confirmarSenha = document.getElementById('confirmar-senha').value;

            if (novaSenha !== confirmarSenha) {
                alert("As senhas não coincidem!");
                return;
            }

            if (novaSenha.length < 6) {
                alert("A senha deve ter no mínimo 6 caracteres!");
                return;
            }

            alert("Senha redefinida com sucesso!");
            
            // Simula envio de e-mail de confirmação
            setTimeout(() => {
                window.location.href = "login.html";
            }, 1200);
        });
    </script>
</body>
</html>
