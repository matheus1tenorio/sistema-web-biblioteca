<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - BiblioTech</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="cadastro-container">
        <div class="cadastro-box">
            <h1>Criar Conta</h1>
            <p>Preencha os dados para se cadastrar</p>

            <form id="cadastro-form">
                <input type="text" id="nome" placeholder="Nome completo" required>
                <input type="email" id="email" placeholder="E-mail" required>
                <input type="password" id="senha" placeholder="Senha" required>
                <input type="password" id="confirmar-senha" placeholder="Confirmar senha" required>

                <button type="submit">Cadastrar</button>
            </form>

            <div class="links">
                <p>
                    Já tem uma conta?
                    <a href="login.html" class="login-link">Faça login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        document
            .getElementById('cadastro-form')
            .addEventListener('submit', async (e) => {

            e.preventDefault();

            const nome = document.getElementById('nome').value.trim();
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const confirmar = document.getElementById('confirmar-senha').value;

            if (senha !== confirmar) {
                alert("As senhas não coincidem!");
                return;
            }

            try {
                const response = await fetch('/api/clientes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        nome,
                        email,
                        senha
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    alert(data.erro || "Erro ao cadastrar");
                    return;
                }

                alert("Cadastro realizado com sucesso!");
                window.location.href = "login.html";

            } catch (error) {
                console.error(error);
                alert("Erro ao conectar com o servidor");
            }

        });
    </script>

</body>
</html>
